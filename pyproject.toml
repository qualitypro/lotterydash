[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lotterydash"
version = "0.1.0"
description = "Local-first Florida Pick 3 playslip planning and calibrated print preview"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lotterydash = "lotterydash.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
